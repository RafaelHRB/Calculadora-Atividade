name: Calculadora CI

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código-fonte
        uses: actions/checkout@v4

      - name: Configurar o Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar, executar testes e gerar o JAR
        run: mvn clean package

      - name: Disponibilizar o JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-ci-jar
          path: target/*.jar
          retention-days: 7
